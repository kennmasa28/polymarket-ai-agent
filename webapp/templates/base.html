<!doctype html>
<html lang="ja" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}PolyAgent{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block head %}{% endblock %}
</head>
<body class="page-{{ page }}">
  <div class="shell">
    <nav class="rail" aria-label="メインメニュー">
      <a class="brand" href="{{ url_for('pages.chat') }}" title="PolyAgent">
        <span class="brand-mark">◆</span><span class="brand-name">PolyAgent</span>
      </a>
      <a class="rail-link {{ 'active' if page == 'chat' }}" href="{{ url_for('pages.chat') }}">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v10H8l-4 4z"/></svg><span>チャット</span></a>
      <a class="rail-link {{ 'active' if page == 'trade' }}" href="{{ url_for('pages.trade') }}">
        <svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span>トレード</span></a>
      <a class="rail-link {{ 'active' if page == 'logs' }}" href="{{ url_for('pages.logs') }}">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>ログ分析</span></a>
      <div class="rail-spacer"></div>
      <button class="rail-link" id="theme-toggle" type="button" title="テーマ切替">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg><span>テーマ</span></button>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="rail-link" type="submit" title="ログアウト">
          <svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>ログアウト</span></button>
      </form>
    </nav>
    <main class="main">{% block main %}{% endblock %}</main>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <dialog id="modal" class="modal"><div class="modal-body" id="modal-body"></div></dialog>
  <script src="{{ url_for('static', filename='vendor/marked.min.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/purify.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
